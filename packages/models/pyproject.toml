[project]
name = "fantasy-models"
version = "0.1.0"
description = "Baselines, cold-start priors, minutes/rate/availability models"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fantasy-core",
    "fantasy-features",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "scipy>=1.18.1",
]

[tool.uv.sources]
fantasy-core = { workspace = true }
fantasy-features = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_models"
