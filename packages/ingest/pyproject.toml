[project]
name = "fantasy-ingest"
version = "0.1.0"
description = "Source clients (Yahoo, NBA CDN, NBA stats, injury PDFs), rate limits/retries, data contracts, pseudonymiser, raw snapshot store + manifest, quarantine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dikit",
    "fantasy-core",
    "fsspec>=2025.3",
    "gcsfs>=2025.3",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "tenacity>=9.1.4",
]

[tool.uv.sources]
dikit = { workspace = true }
fantasy-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_ingest"
