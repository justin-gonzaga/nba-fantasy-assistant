[project]
name = "dikit"
version = "0.1.0"
description = "Decision-intelligence kit: the domain-neutral platform kernel (store, time, evaluate, methods, decide)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fsspec>=2025.3",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "tzdata>=2025.1",
    "pydantic-settings>=2.6",
    "scipy>=1.18.1",
    "structlog>=24.4",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dikit"
