[project]
name = "fantasy-evaluation"
version = "0.1.0"
description = "Walk-forward backtests, historical replay, outcome scoring, calibration, promotion gate"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fantasy-core",
    "fantasy-features",
    "fantasy-models",
    "fantasy-decision",
    "polars>=1.44.2",
    "numpy>=2.5.3",
]

[tool.uv.sources]
fantasy-core = { workspace = true }
fantasy-features = { workspace = true }
fantasy-models = { workspace = true }
fantasy-decision = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_evaluation"
