[project]
name = "fantasy-features"
version = "0.1.0"
description = "Point-in-time feature views over the warehouse via `AsOfReader(t)`"
requires-python = ">=3.13,<3.14"
dependencies = ["fantasy-core"]

[tool.uv.sources]
fantasy-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_features"
