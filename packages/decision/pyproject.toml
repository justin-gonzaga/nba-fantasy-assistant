[project]
name = "fantasy-decision"
version = "0.1.0"
description = "Simulator, per-format `ScoringObjective`, lineup MILP, valuation, rules, evidence + explanations, recommendation log"
requires-python = ">=3.13,<3.14"
dependencies = ["fantasy-core", "fantasy-features", "fantasy-models"]

[tool.uv.sources]
fantasy-core = { workspace = true }
fantasy-features = { workspace = true }
fantasy-models = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_decision"
