[project]
name = "fantasy-api"
version = "0.1.0"
description = "FastAPI read API over the published pipeline outputs (D-62)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dikit",
    "fantasy-core",
    "fantasy-decision",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "polars>=1.44.2",
    "fsspec>=2025.3",
    "gcsfs>=2025.3",
    "google-cloud-firestore>=2.21",
]

[project.scripts]
fantasy-api = "fantasy_api.main:serve"

[tool.uv.sources]
dikit = { workspace = true }
fantasy-core = { workspace = true }
fantasy-decision = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fantasy_api"
