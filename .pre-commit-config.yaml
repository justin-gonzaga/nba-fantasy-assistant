# Pre-commit hooks (security standard §1, FND-005). Installed by `just setup`.
# Run everything by hand with `uv run pre-commit run --all-files`.
# ruff runs from the uv lockfile (local hooks) so hook and CI versions never drift.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Captured source payloads under tests/fixtures stay byte-exact.
      - id: end-of-file-fixer
        exclude: ^packages/[^/]+/tests/fixtures/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^packages/[^/]+/tests/fixtures/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
